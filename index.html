<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙十國慶 MQTT 語音控制台</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#172c4a;background:#f6f8fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#f7dfe3,transparent 40%),linear-gradient(140deg,#fff,#eef3fc)}main{max-width:760px;margin:38px auto;padding:0 18px}.hero{background:linear-gradient(125deg,#b51e34,#db3e51 56%,#153b76 56%);border-radius:24px;color:white;padding:30px;box-shadow:0 16px 38px #172c4a20}.eyebrow{letter-spacing:3px;font-weight:800;font-size:13px}.hero h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.hero p{margin:0;opacity:.9}.sun{float:right;border-radius:50%;width:64px;height:64px;background:repeating-conic-gradient(#fff 0deg 10deg,transparent 10deg 20deg);display:grid;place-items:center}.sun:after{content:'';width:34px;height:34px;background:white;border-radius:50%}.panel{background:white;border:1px solid #e2e8f0;border-radius:20px;margin-top:18px;padding:24px;box-shadow:0 10px 28px #172c4a0c}.status{display:flex;align-items:center;gap:10px;font-weight:750}.dot{width:12px;height:12px;border-radius:50%;background:#e3a72b;box-shadow:0 0 0 5px #e3a72b25}.dot.ok{background:#199b68;box-shadow:0 0 0 5px #199b6825}.dot.bad{background:#c73745;box-shadow:0 0 0 5px #c7374525}.meta{color:#60728d;font-size:14px;margin-top:10px;line-height:1.7}h2{font-size:19px;margin:0 0 15px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{border:0;border-radius:15px;padding:19px 12px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}button:disabled{opacity:.45;cursor:not-allowed}.on{background:#1d477f;color:#fff}.off{background:#e7effb;color:#174176}.all{background:#b8203a;color:white}.toggle{background:#3b82f6;color:white}.voice{width:100%;background:#f6e7eb;color:#9b1a33;margin-top:12px}.voice.active{background:#b8203a;color:white}.hint{font-size:13px;color:#61738d;line-height:1.7;margin-top:12px}.transcript{border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:12px;color:#334155;min-height:46px}.log{max-height:230px;overflow:auto;background:#f8fafc;border-radius:12px;padding:12px;font:13px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.small{background:#eef2f7;color:#254469;font-size:13px;padding:9px 14px}.footer{text-align:center;color:#64748b;font-size:12px;margin:20px 0 35px}@media(max-width:540px){.buttons{grid-template-columns:1fr}.hero{padding:23px}.panel{padding:19px}.sun{width:46px;height:46px}.sun:after{width:24px;height:24px}}
</style></head><body><main><header class="hero"><span class="sun" aria-hidden="true"></span><div class="eyebrow">TAIWAN · DOUBLE TEN</div><h1>雙十國慶 智慧燈光控制</h1><p>MQTT 即時連線 × 語音指令</p></header><section class="panel"><div class="row"><div class="status"><span class="dot" id="dot"></span><span id="status">準備連線...</span></div><button class="small" id="reconnect">重新連線</button></div><div class="meta">Broker：broker.emqx.io　|　WebSocket：8084 (WSS)<br>Topic：<b>ed/test</b>　|　Client ID：<span id="clientId"></span></div></section><section class="panel"><h2>燈光控制</h2><div class="buttons"><button class="on" data-payload="light_on" disabled>💡 Light on</button><button class="off" data-payload="light_off" disabled>🌙 Light off</button><button class="all" data-payload="all_off" disabled>⏻ Turn off all</button><button class="toggle" data-payload="toggle" disabled>🔄 Toggle 切換</button></div><button id="voice" class="voice">🎙 啟動語音控制</button><div class="hint">請說「開燈」、「關燈」或「全部關閉」，分別執行第一、第二、第三個按鈕。首次啟動須允許麥克風權限。部分瀏覽器不支援語音辨識，或在中斷後需要再次點擊啟動。</div><div class="transcript" aria-live="polite"><strong>即時語音辨識文字</strong><div id="heard" style="margin-top:8px;font-size:20px;font-weight:700">等待語音輸入</div><div id="voiceHistory" style="margin-top:9px;font-size:13px;color:#60728d;white-space:pre-line">最近辨識紀錄將顯示於此</div></div></section><section class="panel"><div class="row"><h2>MQTT 訊息紀錄</h2><button class="small" id="clear">清除紀錄</button></div><div class="log" id="log" aria-live="polite"></div></section><div class="footer">雙十國慶主題設計 · 公開 Broker 僅供測試，請勿傳送敏感資料</div></main><script src="https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js"></script><script>
(()=>{'use strict';const topic='ed/test',url='wss://broker.emqx.io:8084/mqtt';const $=id=>document.getElementById(id);const controls=[...document.querySelectorAll('[data-payload]')];const clientId='ed_web_'+Math.random().toString(16).slice(2,10);$('clientId').textContent=clientId;let client=null,connected=false,recognition=null,listening=false,manualStop=false;function log(message){const time=new Date().toLocaleTimeString('zh-TW',{hour12:false});$('log').textContent=`[${time}] ${message}\n`+$('log').textContent.slice(0,9000)}function status(message,type='wait'){connected=type==='ok';$('status').textContent=message;$('dot').className='dot '+(type==='ok'?'ok':type==='bad'?'bad':'');controls.forEach(b=>b.disabled=!connected)}function connect(){if(!window.mqtt){status('無法載入 MQTT.js','bad');log('請檢查網路或 CDN 是否可用');return}if(client){client.removeAllListeners();client.end(true);client=null}status('正在連線...');client=mqtt.connect(url,{clientId,clean:true,connectTimeout:10000,reconnectPeriod:3000,keepalive:30});client.on('connect',()=>{status('已連線','ok');log('連線成功');client.subscribe(topic,{qos:0},err=>log(err?'訂閱失敗：'+err.message:'已訂閱 '+topic))});client.on('reconnect',()=>{status('重新連線中...');log('正在重新連線')});client.on('offline',()=>status('離線','bad'));client.on('close',()=>{if(connected)log('連線中斷');status('連線中斷，等待重連','bad')});client.on('error',err=>{status('連線異常','bad');log('錯誤：'+err.message)});client.on('message',(t,p)=>log('收到 ['+t+'] '+p.toString()))}function publish(payload){if(!client||!connected){log('尚未連線，無法發送');return}client.publish(topic,payload,{qos:0,retain:false},err=>log(err?'發送失敗：'+err.message:'已發送 ['+topic+'] '+payload))}controls.forEach(b=>b.addEventListener('click',()=>publish(b.dataset.payload)));$('reconnect').onclick=connect;$('clear').onclick=()=>$('log').textContent='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const voiceBtn=$('voice');if(!SR){voiceBtn.disabled=true;voiceBtn.textContent='此瀏覽器不支援語音辨識';$('heard').textContent='請使用支援 Web Speech API 的 Chrome 或 Edge'}else{recognition=new SR();recognition.lang='zh-TW';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{listening=true;voiceBtn.classList.add('active');voiceBtn.textContent='🎙 正在聆聽（點擊停止）';log('語音辨識已啟動')};recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript.trim();if(!e.results[i].isFinal){$('heard').textContent='辨識中：'+phrase;continue;}$('heard').textContent='辨識結果：'+phrase;$('voiceHistory').textContent=new Date().toLocaleTimeString('zh-TW')+'　'+phrase+'\n'+$('voiceHistory').textContent.slice(0,1200);const s=phrase.toLowerCase().replace(/[\s.,!?，。！？]/g,'');let payload=null;if(/turnoffall|alloff|全部關閉|全部關|全部燈關|關閉全部|全關/.test(s))payload='all_off';else if(/lighton|開燈|打開燈|燈打開/.test(s))payload='light_on';else if(/lightoff|關燈|關閉燈/.test(s))payload='light_off';else if(/toggle|switch|切換|開關/.test(s))payload='toggle';if(payload){log('語音指令：'+phrase+' → '+payload);publish(payload)}else log('未識別控制指令：'+phrase)}};recognition.onerror=e=>{log('語音辨識錯誤：'+e.error);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))manualStop=true};recognition.onend=()=>{listening=false;voiceBtn.classList.remove('active');voiceBtn.textContent='🎙 啟動語音控制';if(!manualStop&&connected){log('語音辨識已停止，請點擊重新啟動')}};voiceBtn.onclick=()=>{if(listening){manualStop=true;recognition.stop()}else{manualStop=false;try{recognition.start()}catch(e){log('語音啟動失敗：'+e.message)}}}}connect()})();
</script></body></html>
